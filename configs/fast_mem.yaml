# Faster-memory variant for future config-sweep experiments (not used by MVP tests).
# Deferred: validation/stress will sweep base.yaml vs fast_mem.yaml.
soc_name: vlab-soc-fast-mem
cpu_frequency_mhz: 100
ram_latency_ticks: 1
rom_latency_ticks: 1
dma_channels: 1
dma_burst: 4
dma_latency_per_word_ticks: 1
uart_latency_ticks: 5
timer_tick_ticks: 1
sram_size_bytes: 65536
rom_size_bytes: 16384
